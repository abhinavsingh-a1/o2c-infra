# zap-baseline.py rules of promote-to-test (jenkins/lib.sh zap_baseline, -c).
# Format: <rule id><TAB><IGNORE|INFO|WARN|FAIL|OUTOFSCOPE><TAB><name, or the URL regex of OUTOFSCOPE>.
# Rules not listed are WARN. FAIL: the security headers the ui (ui/nginx.conf) and the
# agent API (agent.security) send since E14, so a regression fails the promotion.
# WARN: informational rules (caching, "modern web application").
10003	FAIL	(Vulnerable JS Library)
10017	FAIL	(Cross-Domain JavaScript Source File Inclusion)
10020	FAIL	(Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10036	FAIL	(Server Leaks Version Information via "Server" HTTP Response Header Field)
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10055	FAIL	(CSP: weak directives, e.g. unsafe-inline or wildcards)
10063	FAIL	(Permissions Policy Header Not Set)
10098	FAIL	(Cross-Domain Misconfiguration)
90003	FAIL	(Sub Resource Integrity Attribute Missing)
90004	FAIL	(Insufficient Site Isolation: Cross-Origin-Resource/Embedder/Opener-Policy)
10049	WARN	(Storable and Cacheable Content)
10109	WARN	(Modern Web Application)
10096	WARN	(Timestamp Disclosure - Unix)
# False positive: hash constants (e.g. SHA-1's 0x5A827999) in the minified Swagger UI bundle
10096	OUTOFSCOPE	.*/docs/static/swagger-ui-bundle\.js
