# Used through ANSIBLE_CONFIG (scripts/ansible.sh): on Windows bind mounts the directory
# looks world-writable, and Ansible ignores an ansible.cfg found there by itself.
[defaults]
inventory = inventory.yml
roles_path = roles
retry_files_enabled = False
interpreter_python = /usr/local/bin/python3
stdout_callback = ansible.builtin.default
result_format = yaml
