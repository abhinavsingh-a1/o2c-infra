image:
  repository: o2c-hello
  tag: "0.1.0"
  # Set by the o2c-app release (o2c-gitops envs/*): the image is then repository@digest
  # and the tag is ignored (o2c-app ADR-016). Must be sha256:<64 hex>.
  digest: ""
  pullPolicy: IfNotPresent
# Container command and args; the shared Python service image has no CMD
command: []
args: []
replicaCount: 1
containerPort: 8000
healthPath: /health
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
env: {}
secretName: ""
# Pod and container hardening (Checkov CKV_K8S_*). The images run as a numeric non-root
# user (10001 for the Python services; the ui image runs as 101: override runAsUser).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true # writable /tmp below
  capabilities:
    drop: ["ALL"]
# The services do not call the Kubernetes API
automountServiceAccountToken: false
# Writable scratch space (e.g. intake's PROMETHEUS_MULTIPROC_DIR under /tmp)
tmpSizeLimit: 64Mi
